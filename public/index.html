    @import url('https://fonts.googleapis.com/css2?family=Caprasimo:wght@400&family=Figtree:wght@400;600;700&display=swap');

    :root {
      --color-bg:#f5ead8; --color-surface:#ebddc5; --color-text:#201e1d;
      --color-divider: color-mix(in srgb, #201e1d 14%, transparent);
      --color-neutral-100:#f9f4ed; --color-neutral-200:#eee7db; --color-neutral-300:#dcd3c4;
      --color-neutral-600:#82796a; --color-neutral-700:#645c50; --color-neutral-800:#474238;
      --color-accent-100:#fff2eb; --color-accent-200:#ffe1d0; --color-accent-300:#ffc6a5;
      --color-accent-600:#b2622d; --color-accent-700:#8c491a; --color-accent-800:#643312;
      --color-accent-2-100:#f0fae1; --color-accent-2-300:#ccdbb2; --color-accent-2-500:#8fa073;
      --color-accent-2-600:#728157; --color-accent-2-700:#56633f; --color-accent-2-800:#3d472b;
      --font-heading:"Caprasimo", system-ui, sans-serif;
      --font-body:"Figtree", system-ui, sans-serif;
      --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);
      --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);
      --bg:var(--color-bg); --card:var(--color-surface); --ink:var(--color-text);
      --muted: color-mix(in srgb, var(--color-text) 55%, transparent);
      --line:var(--color-divider);
      --accent:var(--color-accent-2-700);
      --accent2:var(--color-accent-700);
      --B:var(--color-accent-600);
      --C:var(--color-accent-2-600);
      --BC: color-mix(in srgb, var(--color-accent-600) 50%, var(--color-accent-2-600) 50%);
      --A:var(--color-neutral-700);
      --manha:var(--color-accent-300);
      --tarde:var(--color-accent-600);
      --noite:var(--color-accent-2-800);
      --ok:#4f8a5a; --off:#a34b3f;
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family:var(--font-body); background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
    .wrap { max-width:680px; margin:0 auto; padding:16px 14px 60px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px; }
    .nav { background:var(--card); border:1px solid var(--line); border-radius:999px; width:38px; height:38px; font-size:18px; cursor:pointer; color:var(--ink); box-shadow:var(--shadow-sm); }
    .datebox { text-align:center; flex:1; }
    .dow { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; font-weight:700; }
    .date { font-family:var(--font-heading); font-weight:400; font-size:24px; margin-top:3px; letter-spacing:-0.01em; }
    .badge-day { display:inline-block; margin-top:7px; font-size:12px; padding:3px 12px; border-radius:999px; font-weight:700; }
    .wd { background:var(--color-accent-2-100); color:var(--accent); }
    .sat { background:var(--color-accent-100); color:var(--accent2); }
    .sun { background:var(--color-neutral-200); color:var(--BC); }
    .toprow { display:flex; align-items:center; justify-content:center; gap:10px; margin:10px 0 18px; }
    .today-btn { background:none; border:none; color:var(--accent2); font-size:13px; font-weight:600; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
    .sync { display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--muted); font-weight:600; }
    .sync .dot { width:7px; height:7px; border-radius:50%; background:var(--ok); }
    .sync.off .dot { background:var(--off); }
    .block { background:var(--card); border:1px solid var(--line); border-radius:calc(28px * 1.15); padding:14px 14px 6px; margin-bottom:14px; box-shadow:var(--shadow-sm); }
    .bh { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
    .dot-lg { width:12px; height:12px; border-radius:50%; }
    .bh h2 { font-family:var(--font-heading); font-weight:400; font-size:17px; margin:0; }
    .ctx { font-size:12.5px; color:var(--muted); margin:2px 0 10px; line-height:1.5; }
    .task { display:flex; align-items:center; gap:10px; padding:9px 4px; border-top:1px solid var(--line); }
    .task:first-of-type { border-top:none; }
    .chk { width:24px; height:24px; border-radius:50%; border:2px solid var(--line); flex:none; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:13px; color:#fff; background:var(--card); transition:.15s; }
    .chk.on { background:var(--color-accent-2-500); border-color:var(--color-accent-2-500); }
    .tinfo { flex:1; min-width:0; }
    .tname { font-size:14.5px; line-height:1.25; font-weight:600; }
    .task.done .tname { text-decoration:line-through; color:var(--muted); font-weight:600; }
    .tmeta { font-size:11.5px; color:var(--muted); margin-top:2px; }
    .time { font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
    .resp { flex:none; width:30px; height:30px; border-radius:50%; color:#fff; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; cursor:pointer; border:none; }
    .rB { background:var(--B); } .rC { background:var(--C); } .rBC { background:var(--BC); font-size:10px; } .rA { background:var(--A); }
    .section-title { font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; margin:24px 4px 8px; }
    .foco { background:linear-gradient(180deg,color-mix(in srgb, var(--card) 60%, #fff),var(--card)); border:1px solid var(--line); border-left:4px solid var(--accent2); border-radius:20px; padding:6px 14px; box-shadow:var(--shadow-sm); }
    .freqtag { display:inline-block; font-size:10px; font-weight:700; padding:2px 8px; border-radius:999px; background:var(--color-neutral-200); color:var(--color-neutral-800); margin-right:6px; vertical-align:middle; }
    .empty { padding:18px 8px; text-align:center; color:var(--muted); font-size:14px; }
    .balance { display:flex; gap:10px; margin:6px 0 0; flex-wrap:wrap; }
    .bcard { flex:1; min-width:70px; background:var(--card); border:1px solid var(--line); border-radius:calc(28px * 1.15); padding:12px; text-align:center; box-shadow:var(--shadow-sm); }
    .bcard .n { font-family:var(--font-heading); font-weight:400; font-size:26px; }
    .bcard .l { font-size:12px; color:var(--muted); margin-top:2px; }
    details { background:var(--card); border:1px solid var(--line); border-radius:calc(28px * 1.15); padding:4px 14px; margin-top:14px; box-shadow:var(--shadow-sm); }
    summary { cursor:pointer; font-weight:700; font-size:14px; padding:10px 0; }
    .lp { font-size:13px; padding:8px 0; border-top:1px solid var(--line); color:var(--ink); }
    .lp:first-child { border-top:none; }
    .lp small { color:var(--muted); }
    .foot { text-align:center; font-size:11px; color:var(--muted); margin-top:18px; line-height:1.6; }
    .tabbar { display:flex; gap:8px; margin-bottom:16px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
    .tabbar::-webkit-scrollbar { display:none; }
    .tabbtn { flex:none; border:none; border-radius:999px; padding:8px 16px; font-family:var(--font-body); font-weight:700; font-size:13px; cursor:pointer; background:var(--card); color:var(--ink); box-shadow:var(--shadow-sm); }
    .tabbtn.active { background:var(--accent2); color:var(--bg); }
    .addrow { display:flex; gap:8px; margin-bottom:14px; }
    .addinput { flex:1; min-height:40px; padding:8px 14px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-family:var(--font-body); font-size:14px; }
    .addinput:focus { outline:2px solid var(--accent2); outline-offset:1px; }
    .addbtn { flex:none; border:none; border-radius:999px; padding:0 18px; background:var(--accent2); color:var(--bg); font-weight:700; font-size:13px; cursor:pointer; }
    .delbtn { flex:none; width:26px; height:26px; border-radius:50%; border:none; background:var(--color-neutral-200); color:var(--color-neutral-800); font-size:15px; cursor:pointer; line-height:1; }
    .clearbtn { display:block; margin:8px auto 0; background:none; border:none; color:var(--muted); font-size:12px; cursor:pointer; text-decoration:underline; }
    </style>
  </head>

              { "id": 64, "categoria": "Casa geral", "tarefa": "Organizar armarios / desapego", "frequencia": "Trimestral", "quando": "-", "responsavel_sugerido": "BC", "obs": "", "sched": {"tipo":"longo","dica":"Trimestral - mar/jun/set/dez"} },
              { "id": 65, "categoria": "Pets - Saude", "tarefa": "Check-up / vet dos pets", "frequencia": "Trimestral", "quando": "-", "responsavel_sugerido": "C", "obs": "Conforme orientacao", "sched": {"tipo":"longo","dica":"Trimestral - conforme vet"} },
              { "id": 66, "categoria": "Pets - Saude", "tarefa": "Vacinas anuais dos pets", "frequencia": "Anual", "quando": "-", "responsavel_sugerido": "C", "obs": "Raiva, V10, V4 etc.", "sched": {"tipo":"longo","dica":"Anual - conforme carteirinha"} },
              { "id": 67, "categoria": "Manutencao", "tarefa": "Dedetizacao preventiva", "frequencia": "Anual", "quando": "-", "responsavel_sugerido": "B", "obs": "", "sched": {"tipo":"longo","dica":"Anual - sugestao: marco"} },
              { "id": 68, "categoria": "Manutencao", "tarefa": "Revisar extintor / detector de fumaca", "frequencia": "Anual", "quando": "-", "responsavel_sugerido": "B", "obs": "", "sched": {"tipo":"longo","dica":"Anual - sugestao: janeiro"} },
              { "id": 69, "categoria": "Roupas", "tarefa": "Trocar roupas de estacao", "frequencia": "Anual", "quando": "2x/ano", "responsavel_sugerido": "BC", "obs": "Guardar/tirar do armario", "sched": {"tipo":"longo","dica":"2x/ano - abril e outubro"} }
              ];

      let cur = new Date(); cur.setHours(0,0,0,0);
      let SERVER = { resp: {}, done: {}, custom: [], shopping: [] };
      let activeTab = 'guia';
      let analiseWindow = 7;

      function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
      function weekOfMonth(d){return Math.ceil(d.getDate()/7);}
      function isoWeek(d){const t=new Date(d);t.setHours(0,0,0,0);t.setDate(t.getDate()+3-((t.getDay()+6)%7));const w1=new Date(t.getFullYear(),0,4);return 1+Math.round(((t-w1)/86400000-3+((w1.getDay()+6)%7))/7);}

      function respOf(t){ return SERVER.resp[t.id] || t.responsavel_sugerido; }
      function doneKeyOf(t,d){ return ymd(d)+":"+t.id; }
      function isDone(t,d){ return SERVER.done[doneKeyOf(t,d)] || null; }

      function setSync(ok){
          const el = document.getElementById("syncbadge");
        const msg = document.getElementById("syncmsg");
        el.className = "sync" + (ok ? "" : " off");
        msg.textContent = ok ? "sincronizado" : "sem conexao";
      }

      async function refreshState(){
        try{
          const res = await fetch("/api/state");
          if(!res.ok) throw new Error("bad response");
          SERVER = await res.json();
          setSync(true);
          render();
        }catch(e){
          setSync(false);
        }
      }

      async function postJSON(url, body){
          const res = await fetch(url, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body||{}) });
          SERVER = await res.json();
          setSync(true);
          render();
      }

      async function setResp(t){
          try{ await postJSON("/api/resp", { taskId: t.id, defaultResp: t.responsavel_sugerido }); }catch(e){ setSync(false); }
      }

      async function toggle(t,d){
          try{ await postJSON("/api/toggle", { taskId: t.id, date: ymd(d), defaultResp: t.responsavel_sugerido }); }catch(e){ setSync(false); }
      }

      async function addCustom(){
          const inp = document.getElementById("customInput");
          const title = inp.value.trim();
          if(!title) return;
          try{ await postJSON("/api/custom/add", { title }); inp.value=""; }catch(e){ setSync(false); }
      }
      async function toggleCustom(id){ try{ await postJSON("/api/custom/toggle", { id }); }catch(e){ setSync(false); } }
      async function respCustom(id){ try{ await postJSON("/api/custom/resp", { id }); }catch(e){ setSync(false); } }
      async function deleteCustom(id){ try{ await postJSON("/api/custom/delete", { id }); }catch(e){ setSync(false); } }

      async function addShopping(){
          const inp = document.getElementById("shoppingInput");
          const title = inp.value.trim();
          if(!title) return;
          try{ await postJSON("/api/shopping/add", { title }); inp.value=""; }catch(e){ setSync(false); }
      }
      async function toggleShopping(id){ try{ await postJSON("/api/shopping/toggle", { id }); }catch(e){ setSync(false); } }
      async function deleteShopping(id){ try{ await postJSON("/api/shopping/delete", { id }); }catch(e){ setSync(false); } }
      async function clearShoppingChecked(){ try{ await postJSON("/api/shopping/clear", {}); }catch(e){ setSync(false); } }

      function matchesDay(t,d){
          const s=t.sched,wd=d.getDay();
        if(s.tipo==="daily")return true;
        if(s.tipo==="weekly")return s.dow===wd;
        if(s.tipo==="quinz")return s.dow===wd && (isoWeek(d)%2)===s.parity;
        if(s.tipo==="monthly"){
          if("dom" in s)return d.getDate()===s.dom;
          return s.dow===wd && weekOfMonth(d)===s.week;
        }
        return false;
      }

      function respBtn(t){const r=respOf(t);return "<button class=\"resp r"+r+"\" onclick=\"setResp(TASKS.find(x=>x.id==="+t.id+"))\">"+(r==="BC"?"B+C":r)+"</button>";}

      function taskRow(t,d,showFreq){
          const done=isDone(t,d);
        const meta=[];
        if(showFreq)meta.push("<span class=\"freqtag\">"+t.frequencia+"</span>");
        let sub=t.obs||"";
        const time=(t.quando&&t.quando!=="-")?"<span class=\"time\">"+t.quando+"</span>":"";
        return "<div class=\"task "+(done?'done':'')+"\">"
          +"<div class=\"chk "+(done?'on':'')+"\" onclick=\"toggle(TASKS.find(x=>x.id==="+t.id+"),cur)\">"+(done?'&#10003;':'')+"</div>"
          +"<div class=\"tinfo\"><div class=\"tname\">"+t.tarefa+"</div>"
          +"<div class=\"tmeta\">"+meta.join('')+(sub?"<span>"+sub+"</span>":'')+"</div></div>"
          +time+respBtn(t)
          +"</div>";
      }

      const CTX = {
        weekday:{
          manha:"07h acordar - Breno arruma a cama, Carol faz o cafe - 08-09h trabalho (os dois) - 09h Carol vai ao escritorio",
            tarde:"11:30 CrossFit - 14h almoco na vo do Breno - Carol volta ao escritorio - Breno no 2o bloco de trabalho",
            noite:"18h Carol chega - arrumar a casa juntos - jantar de marmita"
        },
          sat:{manha:"Sabado sem rotina de trabalho - CrossFit se rolar - cafe com calma",
                   tarde:"Dia de tarefas pesadas da casa - hora de zerar o que ficou",
                   noite:"Fechar a casa arrumada pro domingo - jantar tranquilo"},
            sun:{manha:"Domingo leve - sem trabalho - aproveitar o cafe",
                       tarde:"Descanso - so o essencial dos pets e da cozinha",
                       noite:"Preparar o clima pra semana - jantar tranquilo"}
      };

      function showTab(tab){
          activeTab = tab;
          ["guia","avulsas","mercado","analise"].forEach(function(t){
                document.getElementById("view-"+t).style.display = (t===tab) ? "" : "none";
          });
          document.querySelectorAll(".tabbtn[data-tab]").forEach(function(b){
                b.classList.toggle("active", b.getAttribute("data-tab")===tab);
          });
          render();
      }

      function setAnaliseWindow(n){ analiseWindow = n; render(); }

      function renderGuia(){
          const d=cur, wd=d.getDay();
        const dias=["domingo","segunda-feira","terca-feira","quarta-feira","quinta-feira","sexta-feira","sabado"];
        document.getElementById("dow").textContent=dias[wd];
        document.getElementById("date").textContent=d.getDate()+" de "+["janeiro","fevereiro","marco","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"][d.getMonth()];
        const bd=document.getElementById("daybadge");
        let ctx;
        if(wd===6){bd.textContent="Sabado - dia pesado";bd.className="badge-day sat";ctx=CTX.sat;}
        else if(wd===0){bd.textContent="Domingo - dia leve";bd.className="badge-day sun";ctx=CTX.sun;}
        else{bd.textContent="Dia util";bd.className="badge-day wd";ctx=CTX.weekday;}

        const dailyByP={manha:[],tarde:[],noite:[]};
        TASKS.filter(t=>t.sched.tipo==="daily").forEach(t=>dailyByP[t.periodo].push(t));
        const blockDefs=[["manha","Manha","var(--manha)"],["tarde","Tarde","var(--tarde)"],["noite","Noite","var(--noite)"]];
        let bh="";
        blockDefs.forEach(function(def){
            const k=def[0],label=def[1],color=def[2];
            bh+="<div class=\"block\"><div class=\"bh\"><span class=\"dot-lg\" style=\"background:"+color+"\"></span><h2>"+label+"</h2></div>";
          bh+="<div class=\"ctx\">"+ctx[k]+"</div>";
          dailyByP[k].forEach(function(t){bh+=taskRow(t,d,false);});
          bh+="</div>";
        });
        document.getElementById("blocks").innerHTML=bh;

        const foco=TASKS.filter(t=>t.sched.tipo!=="daily"&&t.sched.tipo!=="longo"&&matchesDay(t,d));
        const fEl=document.getElementById("foco");
        if(foco.length===0){
          fEl.innerHTML="<div class=\"empty\">"+(wd===0?"Domingo e dia de descanso. So o essencial hoje.":"Nada extra hoje alem da rotina!")+"</div>";
        }else{
          foco.sort(function(a,b){return a.frequencia.localeCompare(b.frequencia);});
          fEl.innerHTML=foco.map(function(t){return taskRow(t,d,true);}).join("");
        }

        let cB=0,cC=0,tot=0;
        const allToday=TASKS.filter(t=>matchesDay(t,d));
        allToday.forEach(function(t){const entry=isDone(t,d);if(entry){tot++;if(entry.by==="B")cB++;else if(entry.by==="C")cC++;else if(entry.by==="BC"){cB++;cC++;}}});
        document.getElementById("cntB").textContent=cB;
        document.getElementById("cntC").textContent=cC;
        document.getElementById("cntT").textContent=tot;

        document.getElementById("lp").innerHTML=TASKS.filter(t=>t.sched.tipo==="longo")
        .map(function(t){return "<div class=\"lp\">"+t.tarefa+" <small>- "+t.sched.dica+"</small></div>";}).join("");
      }

      function renderCustom(){
          const list = SERVER.custom || [];
          const el = document.getElementById("customList");
          if(!el) return;
          if(list.length===0){ el.innerHTML = "<div class=\"empty\">Nenhuma tarefa avulsa ainda. Adicione algo que nao esta na lista fixa.</div>"; return; }
          el.innerHTML = list.map(function(c){
                const r = c.resp || "BC";
                return "<div class=\"task "+(c.done?'done':'')+"\">"
                  +"<div class=\"chk "+(c.done?'on':'')+"\" onclick=\"toggleCustom("+c.id+")\">"+(c.done?'&#10003;':'')+"</div>"
                  +"<div class=\"tinfo\"><div class=\"tname\">"+c.title+"</div></div>"
                  +"<button class=\"resp r"+r+"\" onclick=\"respCustom("+c.id+")\">"+(r==="BC"?"B+C":r)+"</button>"
                  +"<button class=\"delbtn\" onclick=\"deleteCustom("+c.id+")\">&times;</button>"
                  +"</div>";
          }).join("");
      }

      function renderShopping(){
          const list = SERVER.shopping || [];
          const el = document.getElementById("shoppingList");
          if(!el) return;
          if(list.length===0){ el.innerHTML = "<div class=\"empty\">Lista vazia. Adicione itens do mercado.</div>"; return; }
          el.innerHTML = list.map(function(s){
                return "<div class=\"task "+(s.checked?'done':'')+"\">"
                  +"<div class=\"chk "+(s.checked?'on':'')+"\" onclick=\"toggleShopping("+s.id+")\">"+(s.checked?'&#10003;':'')+"</div>"
                  +"<div class=\"tinfo\"><div class=\"tname\">"+s.title+"</div></div>"
                  +"<button class=\"delbtn\" onclick=\"deleteShopping("+s.id+")\">&times;</button>"
                  +"</div>";
          }).join("");
      }
      function computeAnalytics(days){
          const end = new Date(); end.setHours(0,0,0,0);
          const start = new Date(end); start.setDate(end.getDate()-(days-1));
          const stats = {};
          let cB=0,cC=0,totExpected=0,totDone=0;
          for(let i=0;i<days;i++){
                const d = new Date(start); d.setDate(start.getDate()+i);
                TASKS.filter(function(t){return t.sched.tipo!=="longo";}).forEach(function(t){
                        if(matchesDay(t,d)){
                                  if(!stats[t.id]) stats[t.id] = { task:t, expected:0, done:0 };
                                  stats[t.id].expected++;
                                  totExpected++;
                                  const entry = SERVER.done[ymd(d)+":"+t.id];
                                  if(entry){
                                              stats[t.id].done++;
                                              totDone++;
                                              if(entry.by==="B")cB++; else if(entry.by==="C")cC++; else if(entry.by==="BC"){cB++;cC++;}
                                  }
                        }
                });
          }
          return { stats:stats, cB:cB, cC:cC, totExpected:totExpected, totDone:totDone };
      }

      function renderAnalise(){
          const anEl = document.getElementById("anPct");
          if(!anEl) return;
          const a = computeAnalytics(analiseWindow);
          const pct = a.totExpected ? Math.round(100*a.totDone/a.totExpected) : 0;
          document.getElementById("anPct").textContent = pct+"%";
          document.getElementById("anB").textContent = a.cB;
          document.getElementById("anC").textContent = a.cC;
          document.getElementById("anCustom").textContent = (SERVER.custom||[]).filter(function(c){return c.done;}).length;

          const arr = Object.keys(a.stats).map(function(k){
                const s = a.stats[k];
                return { task:s.task, expected:s.expected, done:s.done, missed:s.expected-s.done };
          });
          const missed = arr.filter(function(s){return s.missed>0;}).sort(function(x,y){return y.missed-x.missed;}).slice(0,8);
          const perfect = arr.filter(function(s){return s.missed===0;}).sort(function(x,y){return y.expected-x.expected;}).slice(0,5);

          document.getElementById("anMissed").innerHTML = missed.length ? missed.map(function(s){
                return "<div class=\"lp\">"+s.task.tarefa+" <small>- cumprida "+s.done+" de "+s.expected+" vezes</small></div>";
          }).join("") : "<div class=\"empty\">Nenhuma pendencia nesse periodo. Mandando bem!</div>";

          document.getElementById("anPerfect").innerHTML = perfect.length ? perfect.map(function(s){
                return "<div class=\"lp\">"+s.task.tarefa+" <small>- "+s.expected+" de "+s.expected+"</small></div>";
          }).join("") : "<div class=\"empty\">Ainda sem tarefas 100% em dia nesse periodo.</div>";

          document.querySelectorAll(".winbtn").forEach(function(b){
                b.classList.toggle("active", parseInt(b.getAttribute("data-win"),10)===analiseWindow);
          });
      }

      function render(){
          renderGuia();
          renderCustom();
          renderShopping();
          renderAnalise();
      }

      function go(n){cur.setDate(cur.getDate()+n);render();}
      function today(){cur=new Date();cur.setHours(0,0,0,0);render();}

      document.querySelector(".tabbtn[data-tab='guia']").classList.add("active");
      refreshState();
      setInterval(function(){refreshState();}, 4000);
      document.addEventListener("visibilitychange", function(){ if(!document.hidden) refreshState(); });
      
      
</script>
